name: checks
on:
  push:
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install --no-deps -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Build demo native binary
        run: model2mechanism compile --traces examples/chatbot.jsonl --out build/demo --build
      - name: Smoke test
        run: test "$(./build/demo/chatbot hello)" = "Hello. How can I help?"
